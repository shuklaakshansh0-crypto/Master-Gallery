<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Studio</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f0f2f5;
      --sub: rgba(255, 255, 255, 0.55);
      --accent: #3b82f6;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 30px 20px 80px 20px;
      display: flex;
      justify-content: center;
    }
    .studio-shell { width: 100%; max-width: 860px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    /* Token Gate Overlay */
    #gate-screen {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 32px;
      border-radius: 12px;
      text-align: center;
      max-width: 440px;
      margin: 60px auto;
    }
    #gate-screen input {
      width: 100%;
      padding: 10px 14px;
      margin: 16px 0;
      background: #000;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
    }
    /* Workbench Layout */
    .tabs { display: flex; gap: 10px; margin-bottom: 24px; }
    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--sub);
      padding: 8px 18px;
      border-radius: 9999px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.88rem;
    }
    .tab-btn.active { background: #fff; color: #000; border-color: #fff; }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.82rem; color: var(--sub); margin-bottom: 6px; }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px 12px;
      background: #000;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    /* Eyedropper Canvas Area */
    .canvas-box {
      margin-top: 10px;
      text-align: center;
      background: #000;
      padding: 14px;
      border-radius: 8px;
      border: 1px dashed var(--border);
    }
    #pick-canvas {
      max-width: 100%;
      max-height: 280px;
      cursor: crosshair;
      border-radius: 6px;
      display: none;
    }
    .color-swatches {
      display: flex;
      gap: 16px;
      margin-top: 14px;
      align-items: center;
      justify-content: center;
    }
    .swatch-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: rgba(255,255,255,0.06);
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      font-size: 0.85rem;
      transition: all 0.15s ease;
    }
    .swatch-btn.active { 
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.15);
    }
    .swatch-circle { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.4); }
    /* Live Gradient Preview */
    .preview-box {
      height: 90px;
      border-radius: 10px;
      margin-top: 16px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.8);
      letter-spacing: 0.05em;
    }
    .btn-primary {
      background: #fff;
      color: #000;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      width: 100%;
      font-size: 0.92rem;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-save-order {
      background: var(--success);
      color: #fff;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      transition: opacity 0.2s;
    }
    .btn-save-order:disabled { opacity: 0.35; cursor: not-allowed; }
    /* Reorder / Manage List */
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: grab;
      user-select: none;
      transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }
    .item-row.dragging {
      opacity: 0.4;
      background: rgba(59, 130, 246, 0.2);
    }
    .item-row.drag-over {
      border-color: var(--accent);
      transform: scale(1.01);
    }
    .item-meta { display: flex; align-items: center; gap: 14px; pointer-events: none; }
    .drag-handle { color: var(--sub); font-size: 1.1rem; padding-right: 4px; }
    .item-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 5px; background: #222; }
    .action-btns { display: flex; gap: 6px; align-items: center; }
    .action-btns button {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.8rem;
      line-height: 1;
    }
    .action-btns button:hover:not(:disabled) { background: rgba(255,255,255,0.2); }
    .action-btns button:disabled { opacity: 0.25; cursor: not-allowed; }
    .action-btns button.del:hover { background: #e11d48; border-color: #e11d48; }
    #status-bar {
      margin-top: 14px;
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
      color: #93c5fd;
    }
    #reorder-status {
      font-size: 0.82rem;
      margin-left: 12px;
      color: #facc15;
    }
  </style>
</head>
<body>
  <div class="studio-shell">
    <!-- Screen 1: Token Gate -->
    <div id="gate-screen">
      <h2>Studio Authorization</h2>
      <p style="font-size: 0.82rem; color: var(--sub); margin-top: 8px;">Enter your GitHub Personal Access Token to manage your wall.</p>
      <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx">
      <button class="btn-primary" id="save-token-btn">Unlock Studio</button>
    </div>

    <!-- Screen 2: Studio Workbench -->
    <div id="workbench" style="display: none;">
      <header>
        <h1>Curator Studio</h1>
        <button class="btn-secondary" id="logout-btn">Lock Studio</button>
      </header>

      <div class="tabs">
        <button class="tab-btn active" data-tab="create">New Entry</button>
        <button class="tab-btn" data-tab="manage">Manage & Reorder Wall</button>
      </div>

      <!-- Tab: Create / Edit -->
      <section id="tab-create" class="panel">
        <div class="form-group">
          <label>Target Medium</label>
          <select id="entry-medium">
            <option value="music">Music</option>
            <option value="cinema">Cinema</option>
            <option value="tv">TV</option>
          </select>
        </div>

        <div class="form-group">
          <label>Title</label>
          <input type="text" id="entry-title" placeholder="e.g., Ode to the Mets">
        </div>

        <div class="form-group">
          <label id="label-secondary">Artist</label>
          <input type="text" id="entry-secondary" placeholder="e.g., The Strokes">
        </div>

        <div class="form-group">
          <label id="label-tertiary">Release Year</label>
          <input type="text" id="entry-tertiary" placeholder="e.g., 2020">
        </div>

        <div class="form-group" id="quote-group" style="display: none;">
          <label>Standout Quote / Dialogue</label>
          <input type="text" id="entry-quote" placeholder="e.g., All the best memories are hers.">
        </div>

        <div class="form-group">
          <label id="label-file">Artwork Upload (1:1 for Music, 16:9 for Screen)</label>
          <input type="file" id="entry-file" accept="image/*">
          <div class="canvas-box">
            <p id="canvas-hint" style="font-size: 0.78rem; color: var(--sub); margin-bottom: 8px;">Upload image to activate manual eyedropper</p>
            <canvas id="pick-canvas"></canvas>
            <div class="color-swatches">
              <span style="font-size: 0.8rem; color: var(--sub);">Active Target:</span>
              <button class="swatch-btn active" id="btn-pick-c1" type="button">
                <span class="swatch-circle" id="circle-c1" style="background: #1e3a5f;"></span> Color 1
              </button>
              <button class="swatch-btn" id="btn-pick-c2" type="button">
                <span class="swatch-circle" id="circle-c2" style="background: #0d1b2a;"></span> Color 2
              </button>
            </div>
            <div class="preview-box" id="gradient-preview">Gradient Preview</div>
          </div>
        </div>

        <button class="btn-primary" id="publish-btn">Publish to Wall</button>
        <p id="status-bar"></p>
      </section>

      <!-- Tab: Manage & Reorder -->
      <section id="tab-manage" class="panel" style="display: none;">
        <div class="form-group">
          <label>Select Wall to Reorder</label>
          <select id="manage-medium">
            <option value="music">Music</option>
            <option value="cinema">Cinema</option>
            <option value="tv">TV</option>
          </select>
        </div>

        <div style="display: flex; align-items: center; margin-bottom: 12px;">
          <button class="btn-save-order" id="save-order-btn" disabled>Save Wall Sequence</button>
          <span id="reorder-status"></span>
        </div>

        <div id="manage-list"></div>
      </section>
    </div>
  </div>

  <script src="studio.js"></script>
</body>
</html>
